name: bmcsacco_app
description: TMI Staff SACCO Member Portal
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & Networking
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # Secure Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^13.2.4

  # UI & Design
  unicons: ^2.1.1
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.0

  # Image picker for avatar upload
  image_picker: ^1.1.2

  # Live camera + ML Kit for KYC facial scan
  camera: ^0.10.5+9
  google_mlkit_face_detection: ^0.14.0

  # Device info & permissions
  device_info_plus: ^10.1.0
  permission_handler: ^11.3.1

  # Utils
  web_socket_channel: ^3.0.1
  uuid: ^4.4.2
  crypto: ^3.0.3
  intl: ^0.19.0
  url_launcher: ^6.2.6
  package_info_plus: ^8.0.0
  path_provider: ^2.1.4
  open_file: ^3.3.2

  # Sharing & Connectivity
  share_plus: ^10.0.0
  connectivity_plus: ^6.0.3

  # Push Notifications & Crash Reporting
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.1.3

  # Biometric Authentication
  local_auth: ^2.3.0
  sentry_flutter: ^8.14.2

  # Invisible reCAPTCHA v3 token capture for self-registration (see RecaptchaService)
  webview_flutter: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon-512.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon-512.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
